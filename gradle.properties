org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# App identity. Change these to rebrand the app (the display name lives in
# app/src/main/res/values/strings.xml -> app_name).
# ---------------------------------------------------------------------------
aura.applicationId=com.aura.dashboard
aura.versionCode=2
aura.versionName=1.1.0

# ---------------------------------------------------------------------------
# News API configuration (optional).
# NEVER commit real keys here. Put them in local.properties (git-ignored) or
# export them as environment variables:
#   AURA_NEWS_API_BASE_URL  e.g. https://your-proxy.example.workers.dev/
#   AURA_NEWS_API_KEY       NewsData.io key (development only)
# Without either, the app uses publishers' public RSS feeds.
# ---------------------------------------------------------------------------
